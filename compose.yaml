services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_MODE: local
      DATA_DIR: /data
      DEV_TOKEN: ${DEV_TOKEN:-local-development-only}
    volumes:
      - library-data:/data
  worker:
    build: .
    command: ["python", "-m", "photo_library.worker"]
    environment:
      APP_MODE: local
      DATA_DIR: /data
    volumes:
      - library-data:/data
    stop_grace_period: 120s
volumes:
  library-data:

